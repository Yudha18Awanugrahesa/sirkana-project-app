<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />
    <title>SIRKANA · Offline</title>
    <style>
      :root{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.card{width:min(100%,420px);padding:36px;border:1px solid #e2e8f0;border-radius:24px;background:white;text-align:center;box-shadow:0 20px 60px #0f172a0d}.mark{width:64px;height:64px;margin:0 auto 20px}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:12px;font-weight:700}h1{font-size:25px;letter-spacing:-.04em}p{color:#64748b;line-height:1.7;font-size:14px}button{border:0;border-radius:10px;background:#2563eb;color:white;padding:12px 18px;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><img class="mark" src="/sirkana-mark.svg" alt="Sirkana"/><span class="pill">Koneksi terputus</span><h1>Kamu sedang offline</h1><p>Sirkana belum dapat menghubungkan ke server. Halaman ini hanya memberi informasi status koneksi. Transaksi dan perubahan stok tidak dapat dilakukan secara offline.</p><button onclick="location.reload()">Coba lagi</button></main></body>
</html>
